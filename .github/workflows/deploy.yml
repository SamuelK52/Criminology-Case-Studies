# CaseLab CI/CD: test every push and pull request; deploy main to Railway.
#
# Deploys use the Railway CLI with a *workspace token* (scoped to the
# "Goon Monster's Projects" workspace), stored as the GitHub secret
# RAILWAY_API_TOKEN. Every command names the project, environment and service.
# Railway builds the pushed commit from the connected GitHub repo, runs the
# pre-deploy step (npm run db:setup: migrations + seed), then starts the app.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_CLI_VERSION: 5.71.0
  RAILWAY_PROJECT_ID: 5fc2817f-a743-4fa6-8f8a-043b8bd40497
  RAILWAY_ENVIRONMENT: production
  RAILWAY_SERVICE: web
  LIVE_URL: https://web-production-8e46.up.railway.app

jobs:
  test:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Deploy to Railway
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, oldest first: overlapping deploys can race the
    # pre-deploy step that sets the app role's password (DECISIONS.md #19).
    concurrency:
      group: railway-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ env.LIVE_URL }}
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Check the Railway token is set
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Add the RAILWAY_API_TOKEN repository secret (README → Deploy → GitHub Actions)."
            exit 1
          fi

      - name: Install Railway CLI
        run: |
          npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"
          railway --version

      # The secret may hold a workspace/account token (CLI reads RAILWAY_API_TOKEN)
      # or a project token (CLI reads RAILWAY_TOKEN). Try both; keep what works.
      - name: Check Railway accepts the token
        run: |
          list() { railway deployment list --json --limit 1 \
                     --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" \
                     --service "$RAILWAY_SERVICE" >/dev/null 2>&1; }
          if list; then
            echo "Railway accepted the token as a workspace/account token."
          elif env -u RAILWAY_API_TOKEN RAILWAY_TOKEN="$RAILWAY_API_TOKEN" bash -c "$(declare -f list); list"; then
            echo "Railway accepted the token as a project token."
            echo "RAILWAY_TOKEN_KIND=project" >> "$GITHUB_ENV"
          else
            echo "::error title=Railway rejected the token::Create a new token at railway.com/account/tokens for the workspace that owns the caselab project, and replace the RAILWAY_API_TOKEN secret."
            exit 1
          fi

      - name: Deploy this commit
        run: |
          if [ "$RAILWAY_TOKEN_KIND" = project ]; then export RAILWAY_TOKEN="$RAILWAY_API_TOKEN"; unset RAILWAY_API_TOKEN; fi
          # Surface Railway's message as an annotation so it shows in the run summary.
          if ! out=$(railway redeploy --yes \
                       --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" \
                       --service "$RAILWAY_SERVICE" --commit "$GITHUB_SHA" 2>&1); then
            echo "$out"
            echo "::error title=railway redeploy failed::$(echo "$out" | tail -n 5 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"

      - name: Wait for Railway to finish
        timeout-minutes: 15
        run: |
          if [ "$RAILWAY_TOKEN_KIND" = project ]; then export RAILWAY_TOKEN="$RAILWAY_API_TOKEN"; unset RAILWAY_API_TOKEN; fi
          echo "Waiting for the deployment of ${GITHUB_SHA::7}…"
          while true; do
            if ! json=$(railway deployment list --json \
                          --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" \
                          --service "$RAILWAY_SERVICE" 2>&1); then
              echo "::warning title=railway deployment list failed::$(echo "$json" | tail -n 3 | tr '\n' ' ')"
              json='[]'
            fi
            status=$(echo "$json" | jq -r --arg sha "$GITHUB_SHA" \
                     '[.[] | select(.meta.commitHash == $sha)][0].status // "NOT_FOUND"')
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) echo "::error::Railway deployment ended as $status"; exit 1 ;;
            esac
            sleep 15
          done

      - name: Smoke-test the live site
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$LIVE_URL" | grep -q "Canny Ong murder case"; then
              echo "Live site serves the case bank."; exit 0
            fi
            sleep 10
          done
          echo "::error::$LIVE_URL did not show the case bank"; exit 1
